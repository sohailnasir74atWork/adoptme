apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'
apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")

react { autolinkLibrariesWithApp() }

def enableProguardInReleaseBuilds = true
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.adoptmevaluescalc"
    defaultConfig {
        applicationId "com.adoptmevaluescalc"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 152
        versionName "1.15.26"

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    bundle {
        abi {
            enableSplit = true
        }
    }

    signingConfigs {
        release {
            storeFile file('solanalab.keystore')
            storePassword '798702'
            keyAlias 'solanalabdev'
            keyPassword '798702'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            firebaseCrashlytics {
                nativeSymbolUploadEnabled true
                unstrippedNativeLibsDir "build/intermediates/merged_native_libs/release/out/lib"
            }
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
        // Keep in step with the RNFB BoM override in android/build.gradle
        // (firebase-auth 24.2.0 fixes the Android silent sign-out regression).
        implementation(platform("com.google.firebase:firebase-bom:34.18.0"))
        implementation("com.google.firebase:firebase-analytics")
        implementation("com.google.firebase:firebase-messaging")
        implementation("com.google.firebase:firebase-crashlytics")
    } else {
        implementation jscFlavor
    }
}
