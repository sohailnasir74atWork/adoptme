apply plugin: "com.android.library"

def safeExtGet(name, fallback) {
  rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback
}

android {
  namespace "com.adoptmevaluescalc.tradeocr"
  compileSdkVersion safeExtGet("compileSdkVersion", 35)
  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    consumerProguardFiles "consumer-rules.pro"
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
  // Unbundled Latin text model: Google Play services downloads it (~few MB)
  // instead of it shipping in the APK. See the manifest meta-data.
  implementation "com.google.android.gms:play-services-mlkit-text-recognition:19.0.1"
  // Tile recogniser (classifyTiles). The runtime ships in the app (LiteRT,
  // ~1.7 MB per ABI download, 16 KB page aligned): Play services' TFLite
  // module was not rolled out on the test device ("is_fully_rolled_out=false").
  implementation "com.google.ai.edge.litert:litert:1.4.0"
  implementation "androidx.exifinterface:exifinterface:1.3.7"
}
